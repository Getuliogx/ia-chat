<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CarolIA • Avatar Live</title>
  <link rel="stylesheet" href="/avatar.css">
</head>
<body>
  <main id="stage" class="stage">
    <div class="floor-glow" aria-hidden="true"></div>
    <section id="avatarWrap" class="avatar-wrap" aria-label="Avatar da CarolIA">
      <img id="customAvatar" class="avatar custom-avatar hidden" alt="Avatar personalizado da CarolIA">
      <img id="defaultAvatar" class="avatar default-avatar" src="/assets/carolia-avatar.png" alt="CarolIA">
    </section>
    <audio id="voice" preload="auto" autoplay playsinline></audio>
  </main>
  <script src="/avatar.js"></script>
</body>
</html>
